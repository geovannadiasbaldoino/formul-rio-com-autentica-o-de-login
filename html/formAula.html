<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação</title>
    <link rel="stylesheet" href="../css/formAula.css">
</head>
<body>
    <main class="conteudo">
        <h1>Sistema de Acesso</h1>
        <section class="card">
            <form id="form" action="#" method="post">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" class="user" placeholder="Digite o usuário" maxlength="50" autofocus onfocus="this.select()" autocomplete="off" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="pass" placeholder="Digite a senha" onfocus="this.select()" maxlength="16" autocomplete="off" required>

                <input class="in" type="submit" value="Acessar">
                <input class="out" type="reset" value="Limpar">
            </form>
        </section>
        <h3 id="h3"></h3>
    </main>




    <script src="../js/formAula.js"></script>
</body>
</html>
